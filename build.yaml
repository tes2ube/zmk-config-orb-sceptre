# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: settings_reset
  # TEMPORARY test build: left half with Studio AND the USB debug log (second COM port).
  # Flash corne_left-logging.uf2 to the left half to read the keyboard's own log; remove this entry afterwards.
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DSNIPPET="studio-rpc-usb-uart;zmk-usb-logging"
    artifact-name: corne_left-logging
